openapi: 3.1.2
info:
  title: Registry Write examples
  version: 1.0.0-draft
  description: |
    NON-NORMATIVE deployment profile illustrating Write operations for birth registrations,
    households, and individuals. It specialises the GovStack Digital Registries Write contract
    without adding shared domain obligations. Selected PublicSchema vocabulary and schemas are
    references; Write envelopes, review states, source commands, and request-local identifiers are
    example conventions.

    Birth declaration and correction bodies are source commands, not the read Birth resource or an
    action log. After authoritative commit, accepted Birth content maps into a PublicSchema
    `crvs/Birth` projection. Pending, rejected, and blocked Change Requests have no authoritative
    Record effect.

    The example source owns one transaction boundary and exposes households and individuals as
    alternative Collection views. Only its declared compound Household create and add-member
    profiles carry that cross-Record atomic guarantee. The profile does not imply multi-Registry
    transactions, distributed atomicity, or a generic batch-write feature.
  contact:
    name: GovStack Digital Registries Working Group
    url: https://github.com/GovStackWorkingGroup/bb-digital-registries
  x-govstack-api-guide:
    version: 0.3.0-draft
    rulesetVersion: 0.3.0-draft
servers:
  - url: https://registry.example
    description: Reserved non-production deployment used only by these examples.
tags:
  - name: Direct Write examples
    description: Source-backed direct commits using concrete example inputs.
  - name: Change request examples
    description: Immutable proposals with review and application state observed separately.
paths:
  /v1/collections/birth-registrations/records:
    post:
      operationId: createBirthRegistration
      summary: Create a birth declaration directly
      description: >-
        Commits a declaration command and maps accepted Birth content into the authoritative
        PublicSchema Birth projection. Evidence and reasons remain source-command annotations,
        not Birth event fields.
      tags: [Direct Write examples]
      security:
        - serviceOAuth: [bb:digital-registries:record:create]
      x-govstack-digital-registries-write:
        registry: https://registry.example/registries/example
        collection: birth-registrations
        capability: create
        inputSchema: ./write-examples.schema.json#/$defs/BirthDeclarationCreateInput
      parameters:
        - $ref: '../write.openapi.yaml#/components/parameters/Traceparent'
        - $ref: '../write.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Source declaration command mapped to a PublicSchema Birth projection.
        content:
          application/json:
            schema:
              $ref: './write-examples.schema.json#/$defs/BirthDeclarationCreateInput'
            example:
              data:
                transactionId: tx-birth-declaration-001
                birth:
                  '@context': https://publicschema.org/ctx/draft.jsonld
                  '@id': urn:request-local:birth-event
                  '@type': https://publicschema.org/crvs/Birth
                  event_date: '2026-10-30'
                  child:
                    '@type': https://publicschema.org/crvs/Person
                    person:
                      '@id': urn:request-local:child
                      '@type': https://publicschema.org/Person
                      given_name: Nok
                      family_name: Example
                  parents:
                    - '@type': https://publicschema.org/crvs/Parent
                      person: https://registry.example/v1/collections/individuals/records/person_42
                      parental_role: gestational
                  sex_at_birth: female
                annotation:
                  reasonCode: initial_declaration
                  statement: Birth declared by the recorded informant.
      responses:
        '201':
          $ref: '#/components/responses/BirthRecordCreated'
        '400':
          $ref: '../write.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../write.openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../write.openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../write.openapi.yaml#/components/responses/CollectionNotAvailable'
        '409':
          $ref: '../write.openapi.yaml#/components/responses/Conflict'
        '415':
          $ref: '../write.openapi.yaml#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '../write.openapi.yaml#/components/responses/UnprocessableContent'
        '429':
          $ref: '../write.openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../write.openapi.yaml#/components/responses/InternalError'
        '503':
          $ref: '../write.openapi.yaml#/components/responses/ServiceUnavailable'
  /v1/collections/households/records:
    post:
      operationId: createHousehold
      summary: Create a Household directly
      description: >-
        Commits a Household with existing Person URI references or, only in the declared
        same-source compound profile, embedded new Persons with request-local `@id` values
        committed atomically.
      tags: [Direct Write examples]
      security:
        - serviceOAuth: [bb:digital-registries:record:create]
      x-govstack-digital-registries-write:
        registry: https://registry.example/registries/example
        collection: households
        capability: create
        inputSchema: ./write-examples.schema.json#/$defs/HouseholdCreateInput
      parameters:
        - $ref: '../write.openapi.yaml#/components/parameters/Traceparent'
        - $ref: '../write.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Existing-reference or explicitly atomic compound Household create input.
        content:
          application/json:
            schema:
              $ref: './write-examples.schema.json#/$defs/HouseholdCreateInput'
            example:
              data:
                '@context': https://publicschema.org/ctx/draft.jsonld
                '@id': urn:request-local:household-existing
                '@type': https://publicschema.org/Household
                name: Example household
                group_type: household
                memberships:
                  - person: https://registry.example/v1/collections/individuals/records/person_42
                    group: urn:request-local:household-existing
                    role: head
                    start_date: '2026-10-01'
                    is_active: true
      responses:
        '201': {$ref: '#/components/responses/HouseholdRecordCreated'}
        '400': {$ref: '../write.openapi.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../write.openapi.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../write.openapi.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../write.openapi.yaml#/components/responses/CollectionNotAvailable'}
        '409': {$ref: '../write.openapi.yaml#/components/responses/Conflict'}
        '415': {$ref: '../write.openapi.yaml#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '../write.openapi.yaml#/components/responses/UnprocessableContent'}
        '429': {$ref: '../write.openapi.yaml#/components/responses/TooManyRequests'}
        '500': {$ref: '../write.openapi.yaml#/components/responses/InternalError'}
        '503': {$ref: '../write.openapi.yaml#/components/responses/ServiceUnavailable'}
  /v1/collections/individuals/records:
    post:
      operationId: createIndividual
      summary: Create a Person directly
      description: Commits an individual using the PublicSchema Person field vocabulary.
      tags: [Direct Write examples]
      security:
        - serviceOAuth: [bb:digital-registries:record:create]
      x-govstack-digital-registries-write:
        registry: https://registry.example/registries/example
        collection: individuals
        capability: create
        inputSchema: ./write-examples.schema.json#/$defs/IndividualCreateInput
      parameters:
        - $ref: '../write.openapi.yaml#/components/parameters/Traceparent'
        - $ref: '../write.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Concrete PublicSchema Person create input.
        content:
          application/json:
            schema:
              $ref: './write-examples.schema.json#/$defs/IndividualCreateInput'
            example:
              data:
                '@context': https://publicschema.org/ctx/draft.jsonld
                '@type': https://publicschema.org/Person
                given_name: Somchai
                family_name: Example
                date_of_birth: '1990-02-12'
      responses:
        '201': {$ref: '#/components/responses/IndividualRecordCreated'}
        '400': {$ref: '../write.openapi.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../write.openapi.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../write.openapi.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../write.openapi.yaml#/components/responses/CollectionNotAvailable'}
        '409': {$ref: '../write.openapi.yaml#/components/responses/Conflict'}
        '415': {$ref: '../write.openapi.yaml#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '../write.openapi.yaml#/components/responses/UnprocessableContent'}
        '429': {$ref: '../write.openapi.yaml#/components/responses/TooManyRequests'}
        '500': {$ref: '../write.openapi.yaml#/components/responses/InternalError'}
        '503': {$ref: '../write.openapi.yaml#/components/responses/ServiceUnavailable'}
  /v1/collections/individuals/records/{recordId}:
    patch:
      operationId: updateRecord
      summary: Apply a merge patch to a Person directly
      description: >-
        Applies an RFC 7396 JSON Merge Patch to the writable Person projection. Send the target
        Record's strong validator in `If-Match`. A synchronous commit returns bodyless `204` with
        the new strong `ETag`.
      tags: [Direct Write examples]
      security:
        - serviceOAuth: [bb:digital-registries:record:update]
      x-govstack-digital-registries-write:
        registry: https://registry.example/registries/example
        collection: individuals
        capability: update
        inputSchema: ./write-examples.schema.json#/$defs/IndividualUpdateInput
        inputMediaType: application/merge-patch+json
      parameters:
        - $ref: '../write.openapi.yaml#/components/parameters/RecordId'
        - $ref: '../write.openapi.yaml#/components/parameters/Traceparent'
        - $ref: '../write.openapi.yaml#/components/parameters/IfMatch'
        - $ref: '../write.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Closed merge-patch subset of the Person projection.
        content:
          application/merge-patch+json:
            schema:
              $ref: './write-examples.schema.json#/$defs/IndividualUpdateInput'
            example:
              data:
                preferred_name: Som
      responses:
        '204':
          description: Person updated and committed; response is bodyless.
          headers:
            ETag: {$ref: '../write.openapi.yaml#/components/headers/StrongETag'}
            Cache-Control: {$ref: '../write.openapi.yaml#/components/headers/CacheControl'}
        '400': {$ref: '../write.openapi.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../write.openapi.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../write.openapi.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../write.openapi.yaml#/components/responses/RecordNotAvailable'}
        '409': {$ref: '../write.openapi.yaml#/components/responses/Conflict'}
        '412': {$ref: '../write.openapi.yaml#/components/responses/PreconditionFailed'}
        '415': {$ref: '../write.openapi.yaml#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '../write.openapi.yaml#/components/responses/UnprocessableContent'}
        '428': {$ref: '../write.openapi.yaml#/components/responses/PreconditionRequired'}
        '429': {$ref: '../write.openapi.yaml#/components/responses/TooManyRequests'}
        '500': {$ref: '../write.openapi.yaml#/components/responses/InternalError'}
        '503': {$ref: '../write.openapi.yaml#/components/responses/ServiceUnavailable'}
  /v1/collections/birth-registrations/records/{recordId}/correct-birth:
    post:
      operationId: correctBirth
      summary: Apply a birth correction directly
      description: >-
        Applies the fixed `correct-birth` transition. Send the authoritative birth-registration
        Record's strong validator in `If-Match`.
        `parameters.birthPatch` names PublicSchema Birth projection fields, while `annotation`
        carries source-command reasons and evidence. The projection changes only after commit.
      tags: [Direct Write examples]
      security:
        - serviceOAuth: [bb:digital-registries:record:transition]
      x-govstack-digital-registries-write:
        registry: https://registry.example/registries/example
        collection: birth-registrations
        capability: transition
        inputSchema: ./write-examples.schema.json#/$defs/BirthCorrectionInput
        action: correct-birth
        transitionProfile: publicschema-birth-correction
      parameters:
        - $ref: '../write.openapi.yaml#/components/parameters/RecordId'
        - $ref: '../write.openapi.yaml#/components/parameters/Traceparent'
        - $ref: '../write.openapi.yaml#/components/parameters/IfMatch'
        - $ref: '../write.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Fixed correction command mapped to the eventual PublicSchema Birth view.
        content:
          application/json:
            schema:
              $ref: './write-examples.schema.json#/$defs/BirthCorrectionInput'
            example:
              name: correct-birth
              parameters:
                transactionId: tx-birth-correction-direct-001
                birthPatch:
                  event_location:
                    location_name: Corrected District Hospital
                annotation:
                  reasonCode: clerical_error
                  statement: Correct the place of occurrence from the supporting facility record.
                  supportingEvidence:
                    - evidenceType: facility_record
                      reference: https://registry.example/evidence/facility_record_991
                      issuedAt: '2026-10-30T09:30:00Z'
      responses:
        '200':
          $ref: '#/components/responses/BirthTransitionApplied'
        '400':
          $ref: '../write.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../write.openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../write.openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../write.openapi.yaml#/components/responses/RecordNotAvailable'
        '409':
          $ref: '../write.openapi.yaml#/components/responses/Conflict'
        '412':
          $ref: '../write.openapi.yaml#/components/responses/PreconditionFailed'
        '415':
          $ref: '../write.openapi.yaml#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '../write.openapi.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: '../write.openapi.yaml#/components/responses/PreconditionRequired'
        '429':
          $ref: '../write.openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../write.openapi.yaml#/components/responses/InternalError'
        '503':
          $ref: '../write.openapi.yaml#/components/responses/ServiceUnavailable'
  /v1/collections/households/records/{recordId}/add-member:
    post:
      operationId: addHouseholdMember
      summary: Add an existing or newly declared Person to a Household
      description: >-
        Applies the fixed `add-member` transition. An existing Person uses an absolute Record URI.
        This profile also accepts an embedded Person with a request-local `@id` under its declared
        same-source atomic transaction. This is not a portable multi-Registry transaction
        guarantee.
      tags: [Direct Write examples]
      security:
        - serviceOAuth: [bb:digital-registries:record:transition]
      x-govstack-digital-registries-write:
        registry: https://registry.example/registries/example
        collection: households
        capability: transition
        inputSchema: ./write-examples.schema.json#/$defs/HouseholdAddMemberInput
        action: add-member
        transitionProfile: publicschema-household-add-member
      parameters:
        - $ref: '../write.openapi.yaml#/components/parameters/RecordId'
        - $ref: '../write.openapi.yaml#/components/parameters/Traceparent'
        - $ref: '../write.openapi.yaml#/components/parameters/IfMatch'
        - $ref: '../write.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: One PublicSchema GroupMembership with an existing URI or embedded new Person.
        content:
          application/json:
            schema:
              $ref: './write-examples.schema.json#/$defs/HouseholdAddMemberInput'
            example:
              name: add-member
              parameters:
                membership:
                  person: https://registry.example/v1/collections/individuals/records/person_88
                  group: https://registry.example/v1/collections/households/records/household_8
                  role: child
                  start_date: '2026-11-04'
                  is_active: true
      responses:
        '200':
          $ref: '#/components/responses/HouseholdTransitionApplied'
        '400':
          $ref: '../write.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../write.openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../write.openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../write.openapi.yaml#/components/responses/RecordNotAvailable'
        '409':
          $ref: '../write.openapi.yaml#/components/responses/Conflict'
        '412':
          $ref: '../write.openapi.yaml#/components/responses/PreconditionFailed'
        '415':
          $ref: '../write.openapi.yaml#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '../write.openapi.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: '../write.openapi.yaml#/components/responses/PreconditionRequired'
        '429':
          $ref: '../write.openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../write.openapi.yaml#/components/responses/InternalError'
        '503':
          $ref: '../write.openapi.yaml#/components/responses/ServiceUnavailable'
  /v1/change-requests:
    post:
      operationId: submitChangeRequest
      summary: Submit a PublicSchema-profile change proposal
      description: >-
        Creates an immutable pending proposal with the corresponding direct operation's concrete
        input and no authoritative Record effect. Transition proposals carry the target Record's
        strong `baseETag`; later review `If-Match` guards the Change Request representation and is
        a separate precondition.
      tags: [Change request examples]
      security:
        - serviceOAuth: [bb:digital-registries:change-request:submit]
      x-govstack-digital-registries-write:
        registry: https://registry.example/registries/example
        capability: change-requests
        inputSchema: ./write-examples.schema.json#/$defs/PublicSchemaChangeRequestInput
      parameters:
        - $ref: '../write.openapi.yaml#/components/parameters/Traceparent'
        - $ref: '../write.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Concrete create or transition proposal for this deployment.
        content:
          application/json:
            schema:
              $ref: './write-examples.schema.json#/$defs/PublicSchemaChangeRequestInput'
            example:
              kind: transition
              target:
                collectionId: birth-registrations
                recordId: birth_19
              baseETag: '"birth-v8"'
              input:
                name: correct-birth
                parameters:
                  transactionId: tx-birth-correction-review-001
                  birthPatch:
                    event_location:
                      location_name: North District Hospital
                  annotation:
                    reasonCode: clerical_error
                    statement: Correct from the facility record.
      responses:
        '201':
          $ref: '#/components/responses/ChangeRequestCreated'
        '400':
          $ref: '../write.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../write.openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../write.openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../write.openapi.yaml#/components/responses/TargetNotAvailable'
        '409':
          $ref: '../write.openapi.yaml#/components/responses/Conflict'
        '415':
          $ref: '../write.openapi.yaml#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '../write.openapi.yaml#/components/responses/UnprocessableContent'
        '429':
          $ref: '../write.openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../write.openapi.yaml#/components/responses/InternalError'
        '503':
          $ref: '../write.openapi.yaml#/components/responses/ServiceUnavailable'
  /v1/change-requests/{changeRequestId}:
    get:
      operationId: getChangeRequest
      summary: Retrieve a PublicSchema-profile change request
      description: Returns the immutable proposal with independent review and application states.
      tags: [Change request examples]
      security:
        - serviceOAuth: [bb:digital-registries:change-request:read]
      parameters:
        - $ref: '../write.openapi.yaml#/components/parameters/ChangeRequestId'
        - $ref: '../write.openapi.yaml#/components/parameters/Traceparent'
        - $ref: '../write.openapi.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/ChangeRequest'
        '304':
          $ref: '../write.openapi.yaml#/components/responses/NotModified'
        '400':
          $ref: '../write.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../write.openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../write.openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../write.openapi.yaml#/components/responses/ChangeRequestNotAvailable'
        '406':
          $ref: '../write.openapi.yaml#/components/responses/NotAcceptable'
        '429':
          $ref: '../write.openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../write.openapi.yaml#/components/responses/InternalError'
        '503':
          $ref: '../write.openapi.yaml#/components/responses/ServiceUnavailable'
  /v1/change-requests/{changeRequestId}/approve:
    post:
      operationId: approveChangeRequest
      summary: Approve the exact PublicSchema-profile proposal version
      description: >-
        `If-Match` guards the Change Request. Approval records only the review decision and returns
        `applicationState: not-started`. A separately authorised worker may later attempt the
        authoritative commit, where stored `baseETag` independently guards the target Record.
      tags: [Change request examples]
      security:
        - serviceOAuth: [bb:digital-registries:change-request:review]
      x-govstack-digital-registries-write:
        registry: https://registry.example/registries/example
        capability: change-requests
      parameters:
        - $ref: '../write.openapi.yaml#/components/parameters/ChangeRequestId'
        - $ref: '../write.openapi.yaml#/components/parameters/Traceparent'
        - $ref: '../write.openapi.yaml#/components/parameters/IfMatch'
        - $ref: '../write.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '../write.openapi.yaml#/components/schemas/ReviewDecisionInput'
      responses:
        '200':
          $ref: '#/components/responses/ChangeRequestApproved'
        '400':
          $ref: '../write.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../write.openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../write.openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../write.openapi.yaml#/components/responses/ChangeRequestNotAvailable'
        '409':
          $ref: '../write.openapi.yaml#/components/responses/Conflict'
        '412':
          $ref: '../write.openapi.yaml#/components/responses/PreconditionFailed'
        '422':
          $ref: '../write.openapi.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: '../write.openapi.yaml#/components/responses/PreconditionRequired'
        '429':
          $ref: '../write.openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../write.openapi.yaml#/components/responses/InternalError'
        '503':
          $ref: '../write.openapi.yaml#/components/responses/ServiceUnavailable'
  /v1/change-requests/{changeRequestId}/reject:
    post:
      operationId: rejectChangeRequest
      summary: Reject the exact PublicSchema-profile proposal version
      description: Rejects the proposal selected by strong `If-Match` without changing any Record.
      tags: [Change request examples]
      security:
        - serviceOAuth: [bb:digital-registries:change-request:review]
      x-govstack-digital-registries-write:
        registry: https://registry.example/registries/example
        capability: change-requests
      parameters:
        - $ref: '../write.openapi.yaml#/components/parameters/ChangeRequestId'
        - $ref: '../write.openapi.yaml#/components/parameters/Traceparent'
        - $ref: '../write.openapi.yaml#/components/parameters/IfMatch'
        - $ref: '../write.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '../write.openapi.yaml#/components/schemas/ReviewDecisionInput'
      responses:
        '200':
          $ref: '#/components/responses/ChangeRequestRejected'
        '400':
          $ref: '../write.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../write.openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../write.openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../write.openapi.yaml#/components/responses/ChangeRequestNotAvailable'
        '409':
          $ref: '../write.openapi.yaml#/components/responses/Conflict'
        '412':
          $ref: '../write.openapi.yaml#/components/responses/PreconditionFailed'
        '422':
          $ref: '../write.openapi.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: '../write.openapi.yaml#/components/responses/PreconditionRequired'
        '429':
          $ref: '../write.openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../write.openapi.yaml#/components/responses/InternalError'
        '503':
          $ref: '../write.openapi.yaml#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    serviceOAuth:
