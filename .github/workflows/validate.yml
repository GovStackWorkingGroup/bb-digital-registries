name: Validate specification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tools -p 'test_*.py'
      - run: uv run python tools/validate_specification.py
      - run: uv run python tools/validate_consultation.py
      - run: uv run python tools/validate_write.py
