# Publishes this draft as an unofficial review preview on the fork's GitHub
# Pages site, so reviewers can read the rendered specification without a local
# build.
#
# The site is rendered by the shared GovStack specification renderer
# (jeremi/govstack-specification-site), pinned to a commit below. Every page
# carries a banner saying it is not an official GovStack site, and a
# noindex, nofollow robots meta tag. Update RENDERER_REF deliberately; do not
# point it at a branch.
#
# The job never runs in the GovStackWorkingGroup repository. Drop this file
# before the change is merged upstream.
name: Deploy review preview

on:
  push:
    branches:
      - docs/digital-registries-3.0.0-alpha.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RENDERER_REPOSITORY: jeremi/govstack-specification-site
  RENDERER_REF: ${{ vars.GOVSTACK_SITE_RENDERER_REF || 'bfa91b536009b9362a946cc356d795ca71639b42' }}

jobs:
  build:
    if: github.repository_owner != 'GovStackWorkingGroup'
    runs-on: ubuntu-latest
    steps:
      - name: Validate the immutable renderer revision
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ ! "$RENDERER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'GOVSTACK_SITE_RENDERER_REF must be a published full renderer commit.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: specification
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.RENDERER_REPOSITORY }}
          ref: ${{ env.RENDERER_REF }}
          path: renderer
          persist-credentials: false
      - name: Require the selected native OpenAPI renderer
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$(git -C renderer rev-parse HEAD)" != "$RENDERER_REF" ]]; then
            printf '%s\n' 'The checked-out renderer does not match the selected commit.' >&2
            exit 1
          fi
          if [[ ! -f renderer/action.yml || ! -f renderer/scripts/api-references.mjs || ! -f renderer/src/components/ReferenceContent.astro ]]; then
            printf '%s\n' 'The renderer pin lacks native OpenAPI support. Set GOVSTACK_SITE_RENDERER_REF to a published revision containing the Scalar integration and build action.' >&2
            exit 1
          fi
      - name: Build and verify the specification site
        uses: ./renderer
        with:
          source: specification
          output: ${{ runner.temp }}/site
          base: /${{ github.event.repository.name }}/
          unofficial: 'true'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
