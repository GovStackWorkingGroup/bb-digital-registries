    title: Registry Service Discovery
    description: An adopter identifies a Registry's responsible authority, authoritative scope, and available service contracts.
  - id: registry-services
    title: Authoritative Registry Services
    description: An authorised consumer uses the Registry's declared services within its responsible authority's scope and access policy.
extensions: []
